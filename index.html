<title>Desk Laporan Keuangan Ditjen P2</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#14233a;--mut:#5d6b7e;--bd:#d8dee7;--ac:#017377;--acbg:#dcefef;--wn:#9a5b00;--wnbg:#fdf0d5;--bd2:#a32d2d;--bdbg:#fbe4e4;--ok:#1f7a45;--okbg:#dff3e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1824;--card:#17222f;--tx:#e6ecf3;--mut:#98a6b8;--bd:#2b3a4c;--ac:#4fc3c7;--acbg:#10383b;--wn:#f0b45a;--wnbg:#3b2d12;--bd2:#f08a8a;--bdbg:#3d1c1c;--ok:#6fd49a;--okbg:#14301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1824;--card:#17222f;--tx:#e6ecf3;--mut:#98a6b8;--bd:#2b3a4c;--ac:#4fc3c7;--acbg:#10383b;--wn:#f0b45a;--wnbg:#3b2d12;--bd2:#f08a8a;--bdbg:#3d1c1c;--ok:#6fd49a;--okbg:#14301f;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#017377;color:#fff;padding:14px 18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:#0a4a4d}}:root[data-theme="dark"] header{background:#0a4a4d}
header h1{margin:0;font-size:1.15rem;font-weight:650}
header p{margin:2px 0 0;font-size:.85rem;opacity:.75}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--bd)}
select,input,button,textarea{font:inherit;color:var(--tx)}
select,input,textarea{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%}
button{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.on,:root:not([data-theme="light"]) button.pri{color:#0f1824}}
:root[data-theme="dark"] button.on,:root[data-theme="dark"] button.pri{color:#0f1824}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.sp{flex:1}
button.lk{background:none;border:0;padding:0 2px;text-decoration:underline;font-weight:600;color:var(--ac);cursor:pointer}button.lk.e{color:var(--bd2)}
#banner{margin:14px 18px 0;padding:10px 14px;background:var(--acbg);border-left:4px solid var(--ac);border-radius:4px;font-size:.9rem}
#toast{margin:10px 18px 0}
main{padding:14px 18px 40px;max-width:1200px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px}
.k b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.k span{color:var(--mut);font-size:.82rem}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:.82rem;color:var(--mut);font-weight:600;background:var(--bg)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.fl td{background:var(--wnbg)}
.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:600}
.b.Draft{background:var(--bg);color:var(--mut);border:1px solid var(--bd)}
.b.Submit{background:var(--acbg);color:var(--ac)}
.b.Disetujui{background:var(--okbg);color:var(--ok)}
.b.Perbaikan{background:var(--bdbg);color:var(--bd2)}
.w{color:var(--wn);font-weight:600}.e{color:var(--bd2);font-weight:600}.g{color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.msg{padding:8px 12px;border-radius:6px;background:var(--wnbg);color:var(--wn)}
.msg.ok{background:var(--okbg);color:var(--ok)}
small{color:var(--mut)}
.fh{margin-bottom:12px}
.fh h2{margin:0 0 4px;font-size:1.1rem}
.fh p{margin:2px 0;color:var(--mut);font-size:.88rem}
.s1{margin:22px 0 6px;font-size:1.05rem}
.s2{margin:16px 0 8px;font-size:.95rem;color:var(--ac)}
.gp{margin:14px 0 6px;font-size:.9rem}
.tb{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin-bottom:10px}
.tb.bad{border-left:4px solid var(--bd2)}
.th{margin:0 0 6px;font-size:.92rem;font-weight:600;line-height:1.4}
.ft{min-width:0}
.ft td{padding:4px 6px}
.ft .lb{width:100%}
.ft .vc{text-align:right;white-space:nowrap;min-width:230px}
.ft .sbr td{color:var(--mut);font-size:.85rem;padding-left:18px}
.vi{width:100%;min-width:100px;max-width:240px;font-size:.95rem;text-align:right;font-variant-numeric:tabular-nums}
.ti{width:100%;min-width:150px}
.sb2{font-size:.8rem;font-weight:600;margin-left:8px}
.tl{width:100%;border-collapse:collapse;font-size:.86rem}.tl td,.tl th{border:1px solid var(--bd);padding:5px 7px;vertical-align:top;text-align:left}.tl th{background:var(--acbg)}.tl td:first-child{width:38px;white-space:nowrap}.tl td:nth-child(3){min-width:210px}.tl td:nth-child(4){width:90px}.tl tr.tn td{background:transparent}.rd{display:inline-block;margin-right:12px;white-space:nowrap}.tl .sb2{margin:3px 0 0}
.pan{margin-top:10px;padding:10px;background:var(--bg);border-radius:6px}
.pan .ph{font-weight:600;font-size:.88rem;margin-bottom:6px}
.ex{min-width:640px}
.ex td{padding:3px 5px}
.ex td:last-child,.ex th:last-child{width:240px}
.sm{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:8px;font-size:.88rem}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 18px;margin-top:8px}
.sig label{display:block;font-size:.82rem;color:var(--mut)}
.sig input{width:100%;margin-top:2px}
.sig h6,.dbody h6{margin:10px 0 4px;font-size:.88rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
details{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin:8px 0;padding:0 12px}
summary{cursor:pointer;padding:9px 0;font-size:.9rem;line-height:1.4}
.dbody{padding:0 0 12px}
.rk{min-width:0}
.rk td,.rk th{padding:5px 8px}
.exs{margin:8px 0}
.exs table{margin-top:4px}
.sumr{color:var(--mut);font-size:.88rem;margin:4px 0 10px}
.lgn{max-width:420px;margin:28px auto}.lgn label{display:block;margin:10px 0;font-size:.88rem;color:var(--mut)}.lgn input{width:100%;margin-top:3px}.up{display:inline-block;padding:4px 10px;border:1px dashed var(--bd);border-radius:6px;font-size:.85rem}.up input{max-width:230px}code{font-size:.82rem}
label.blk{display:block;margin-top:8px;font-size:.88rem;color:var(--mut)}label.blk textarea{width:100%}.hx textarea{width:100%;min-width:200px;font-size:.88rem}.hx select{max-width:150px}
.cfg textarea{width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
@media (max-width:600px){header,.bar{padding-left:16px;padding-right:16px}#banner,#toast{margin-left:16px;margin-right:16px}main{padding-left:16px;padding-right:16px}}

.gd h2{margin:0 0 4px}.gdh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}.gdh p{margin:0;color:var(--mut)}
.gtabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.gtabs input{min-width:200px}
.gbar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0}.gbar div{height:100%;background:var(--ac);transition:width .3s}
.gmain{display:grid;grid-template-columns:260px 1fr;gap:16px;margin:12px 0}
.gnav{display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:8px}
.gnav button{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:8px}
.gnav button small{display:block;color:var(--mut);font-weight:400}
.gnav button.on{background:var(--acbg);border-color:var(--ac);color:var(--tx)}
.gck{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--ac);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.gnav .dn .gck{background:var(--ok);border-color:var(--ok);color:#fff}
.gbody{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px 20px;min-width:0}
.gbody h3{margin:2px 0 10px;font-size:1.25rem}.gbody p,.gbody li{line-height:1.6}
.go,.gu{padding-left:22px}.go li,.gu li{margin:6px 0}
.gc{display:flex;gap:10px;border-radius:8px;padding:10px 12px;margin:12px 0;border:1px solid var(--bd);border-left-width:4px}.gc>b{flex:0 0 auto}.gc>div{min-width:0}
.gc-tip{border-left-color:var(--ok);background:var(--okbg)}.gc-warn{border-left-color:var(--bd2);background:var(--bdbg)}.gc-info{border-left-color:var(--ac);background:var(--acbg)}.gc-ex{border-left-color:var(--wn);background:var(--wnbg)}
.gt{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem}.gt th,.gt td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}.gt th{background:var(--acbg)}
.gflow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin:12px 0}.gfl{flex:1 1 130px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px;border-radius:10px}
.gfl small{color:var(--mut);font-weight:400}.gfl .gn{width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.78rem}
.gfl.esl{border-style:dashed}.ga{align-self:center;color:var(--mut)}.gm{color:var(--mut);font-size:.85rem}
.gsim{border:2px dashed var(--ac);border-radius:10px;padding:10px 14px;margin:14px 0;background:var(--card)}.gsim h6{margin:0 0 8px;font-size:.95rem}
.gs2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 12px;margin:6px 0}.gs2 label{display:block;font-size:.82rem;color:var(--mut)}.gs2 input,.gs2 select{width:100%;margin-top:2px}
.gfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px solid var(--bd)}
.gq{margin:14px 0}.gop{display:block;width:100%;text-align:left;margin:4px 0}.gop.ok{border-color:var(--ok);background:var(--okbg)}.gop.bad{border-color:var(--bd2);background:var(--bdbg)}
.gfb{padding:8px 10px;border-radius:8px;margin:6px 0}.gfb.ok{background:var(--okbg)}.gfb.bad{background:var(--bdbg)}.gscore{font-size:1rem}
.gfaq{margin:18px 0}.gfaq details{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin:6px 0}.gfaq summary{cursor:pointer;font-weight:600}
.gl{display:grid;grid-template-columns:140px 1fr;gap:4px 12px}.gl dt{font-weight:600}.gl dd{margin:0}
code{background:var(--acbg);padding:1px 5px;border-radius:4px}
@media (max-width:820px){.gmain{grid-template-columns:1fr}.gnav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}.gnav button{flex:0 0 auto;min-width:150px}.gl{grid-template-columns:1fr}.gc{flex-direction:column;gap:2px}}
.pwx{position:relative;display:block}.pwx input{width:100%;padding-right:44px;box-sizing:border-box}.pwx .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:6px 8px;cursor:pointer;color:var(--mut);line-height:0;box-shadow:none}.pwx .eye:hover,.pwx .eye:focus-visible{color:var(--ac);background:var(--acbg)}.pwx .eye svg{width:20px;height:20px}
#ft{max-width:1200px;margin:0 auto;padding:6px 18px 20px;color:var(--mut);font-size:.78rem;text-align:right}
</style>

<button id="v1">Input satker</button><button id="v2">Rekap Eselon I</button><button id="gd">Panduan</button>

<span id="who" hidden></span><button id="pw" hidden>Ganti password</button><button id="out" hidden>Keluar</button>

</div>

class Pdf{constructor(J,foot){this.d=new J({unit:'mm',format:'a4'});this.y=14;this.M=14;this.foot=foot}
 need(h){if(this.y+h>280){this.d.addPage();this.y=14}}

  const L=d.splitTextToSize(String(t),182);this.need(L.length*lh+2);d.text(L,o.c?105:this.M,this.y+lh,o.c?{align:'center'}:undefined);this.y+=L.length*lh+(o.g==null?1.5:o.g)}
 table(o){this.need(16);this.d.autoTable({startY:this.y,head:o.head?[o.head]:undefined,body:o.body,theme:'grid',
  styles:{font:'helvetica',fontSize:o.fs||7.5,cellPadding:1.3,lineColor:[190,198,210],lineWidth:.1,textColor:20,overflow:'linebreak'},
  headStyles:{fillColor:[1,115,119],textColor:255,fontStyle:'bold'},columnStyles:o.cols||{},margin:{left:this.M,right:this.M},rowPageBreak:'avoid'});
  this.y=this.d.lastAutoTable.finalY+3.5}
 sig(title,blocks,per){per=per||2;this.need(54);if(title)this.text(title,{b:1,s:9,g:3});const d=this.d,w=(210-28)/per;
  for(let i=0;i<blocks.length;i+=per){this.need(46);const y0=this.y;
   blocks.slice(i,i+per).forEach((b,j)=>{if(!b)return;const cx=14+w*j+w/2;d.setFont('helvetica','normal');d.setFontSize(9);d.text(b.role,cx,y0+4,{align:'center',maxWidth:w-4});
    d.setFont('helvetica','bold');d.text(b.nama||'(..............................)',cx,y0+27,{align:'center'});d.setFont('helvetica','normal');d.text('NIP. '+(b.nip||'..............................'),cx,y0+32,{align:'center'})});
   this.y=y0+40}}
 end(){const d=this.d,n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFont('helvetica','normal');d.setFontSize(7.5);d.setTextColor(90);d.text(this.foot,14,291);d.text('Halaman '+i+' dari '+n,196,291,{align:'right'})}return d}}

async function api1(a,body){
 let r,j;

 try{r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({a,t:TOKEN},body||{})),signal:ac.signal})}
 catch(e){clearTimeout(tm);throw{kode:'jaringan',pesan:e&&e.name==='AbortError'?'Server terlalu lama menjawab. Tunggu sebentar lalu coba lagi.':'Tidak dapat terhubung ke server. Periksa koneksi internet.'}}
 clearTimeout(tm);
 try{j=await r.json()}catch(e){throw{kode:'jaringan',pesan:'Jawaban server tidak terbaca. Periksa alamat server dan pengaturan akses (Anyone).'}}
 if(!j||!j.ok){const k=(j&&j.kode)||'server';if(k==='sesi'&&a!=='masuk')keluarLokal('Sesi berakhir. Silakan masuk lagi.');throw{kode:k,pesan:(j&&j.error)||'Terjadi kesalahan pada server.'}}
 return j}

const HAVE=()=>{const h={};Object.keys(VER).forEach(k=>{h[k]=VER[k]});return h};
async function gasLoad(full){
 if(full){Object.keys(VER).forEach(k=>delete VER[k])}
 const pk=PK(),j=await api('muat',{pk,have:HAVE()});
 if(pk!==PK())return false;
 let ch=false;
 if(j.sat&&j.sat.length){SAT=j.sat.slice().sort((a,b)=>a.c<b.c?-1:a.c>b.c?1:0);if(!SAT.some(x=>x.c===S.sat))S.sat=SAT[0].c}
 if(j.cfg&&j.cfg.uappa){CFG={uappa:Object.assign({nama:'',nip:''},j.cfg.uappa),uappb:Object.assign({nama:'',nip:''},j.cfg.uappb),penelaah:Array.isArray(j.cfg.penelaah)?j.cfg.penelaah:[],pj:normPj(j.cfg.pj)}}
 Object.keys(ARS).forEach(k=>delete ARS[k]);Object.assign(ARS,j.arsip||{});
 Object.keys(j.items||{}).forEach(c=>{const e=E[c]||(E[c]=blankE());
  Object.keys(j.items[c]).forEach(part=>{const it=j.items[c][part];
   if(part==='review'){e.review=it.d&&it.d.st!==undefined?it.d:null}
   else if(part==='hasil'){if(!HDIRTY.has(c))e.hasil=normHasil(it.d)}
   else if(!dirty.has(c)){setPart(e,part,it.d);LW[part+pk+'_'+c]=JSON.stringify(getPart(e,part))}
   else return;
   VER[c+'|'+part]=it.v;ch=true})});
 LOADED=true;return ch}
async function flushOneG(c){const e=E[c];if(!e)return;const pk=PK(),id=pk+'_'+c,bl=blankE(),parts={},sent=[];
 for(const col of PARTS){const d=getPart(e,col),js=JSON.stringify(d),k=col+id;
  if(LW[k]===js)continue;if(LW[k]===undefined&&js===JSON.stringify(getPart(bl,col)))continue;
  parts[col]={b:VER[c+'|'+col]||0,d};sent.push([col,js])}
 if(!sent.length)return;
 const j=await api('simpan',{pk,parts});let conf=false;
 for(const [col,js] of sent){const h=(j.hasil||{})[col];if(!h)continue;
  if(h.konflik){conf=true;delete VER[c+'|'+col];continue}
  VER[c+'|'+col]=h.v;LW[col+id]=js;
  if(col==='meta'&&h.d){e.meta.st=h.d.st;e.meta.sub=h.d.sub}}
 if(conf){const n=await gasRebase(c,sent.filter(([col])=>VER[c+'|'+col]===undefined).map(x=>x[0]));
  if(n)toast('Data satker ini juga diubah dari perangkat atau tab lain. Isian Anda digabung dengan isian terbaru di server; periksa kembali.');
  dirty.add(c);scheduleFlush();onData()}}
const J_=x=>JSON.stringify(x),CL=x=>x===undefined?x:JSON.parse(JSON.stringify(x));
function merge3(b,l,r){
 if(J_(l)===J_(b))return CL(r);
 if(J_(r)===J_(b)||J_(r)===J_(l))return CL(l);
 const ob=x=>x&&typeof x==='object';
 if(ob(l)&&ob(r)&&Array.isArray(l)===Array.isArray(r)){
  if(Array.isArray(l)){const o=[],n=Math.max(l.length,r.length);for(let i=0;i<n;i++){const bi=ob(b)?b[i]:undefined;o.push(i>=l.length?CL(r[i]):i>=r.length?CL(l[i]):merge3(bi,l[i],r[i]))}return o}
  const o={},bb=ob(b)&&!Array.isArray(b)?b:{};Object.keys(Object.assign({},r,l)).forEach(k=>{if(!(k in l))o[k]=CL(r[k]);else if(!(k in r))o[k]=J_(l[k])===J_(bb[k])?undefined:CL(l[k]);else o[k]=merge3(bb[k],l[k],r[k])});
  Object.keys(o).forEach(k=>{if(o[k]===undefined)delete o[k]});return o}
 return CL(l)}
async function gasRebase(c,cols){
 if(!cols.length)return 0;const pk=PK(),id=pk+'_'+c,have=HAVE();cols.forEach(col=>{have[c+'|'+col]=0});
 const j=await api('muat',{pk,have}),e=E[c];let n=0;
 cols.forEach(col=>{const it=j.items&&j.items[c]&&j.items[c][col];if(!it)return;
  const tmp=blankE();setPart(tmp,col,CL(it.d));const rem=getPart(tmp,col),k=col+id;
  let base;try{base=LW[k]?JSON.parse(LW[k]):getPart(blankE(),col)}catch(x){base=getPart(blankE(),col)}
  const loc=getPart(e,col);let mg=merge3(base,CL(loc),CL(rem));
  if(col==='meta'){mg.st=rem.st;mg.sub=rem.sub}
  setPart(e,col,mg);LW[k]=J_(rem);VER[c+'|'+col]=it.v;n++});
 return n}
function gasErr(err,c){
 const k=err&&err.kode;
 if(k==='jaringan'){if(c)dirty.add(c);setSync('Gagal menyimpan: '+err.pesan+' Mencoba lagi.');setTimeout(scheduleFlush,6000);return}
 if(k==='sesi')return;
 if(c&&k!=='terkunci'&&k!=='akses'&&k!=='besar'){dirty.add(c);setSync('Belum tersimpan: '+((err&&err.pesan)||'server sibuk')+' Mencoba lagi otomatis.');setTimeout(scheduleFlush,8000);return}
 setSync('Gagal menyimpan');toast((err&&err.pesan)||'Gagal menyimpan.');
 if(k==='terkunci'&&c){delete VER[c+'|meta'];gasLoad(true).then(()=>render()).catch(()=>{})}}
async function gasKirim(){
 if(BUSYG)return;BUSYG=true;const c=S.sat,btn=$('#sub');if(btn){btn.disabled=true;btn.textContent='Mengirim...'}
 try{await flushNow();
  const J=await pdfLib(),e0=E[c]||(E[c]=blankE()),m0=e0.meta;e0.meta=Object.assign({},m0,{st:'Submit',sub:(m0.sub||0)+1});let buf;try{buf=pdfSatker(J,c).output('arraybuffer')}finally{e0.meta=m0}
  const j=await api('kirim',{pk:PK(),pdf:toB64(buf)}),e=E[c]||(E[c]=blankE());
  e.meta.st=j.meta.st;e.meta.sub=j.meta.sub;VER[c+'|meta']=j.v;LW['meta'+PK()+'_'+c]=JSON.stringify(e.meta);
  (ARS[c]=ARS[c]||[]).push(j.arsip);
  S.msg='Data terkirim ke Eselon I. Salinan PDF diarsipkan dengan SHA-256 '+j.arsip.hash.slice(0,16)+'... Cetak PDF, tandatangani, pindai, lalu unggah scan-nya pada bagian Arsip dan bukti.'}
 catch(err){S.msg='!Pengiriman gagal: '+((err&&(err.pesan||err.message))||err);if(err&&err.kode==='terkunci')gasLoad(true).catch(()=>{})}
 finally{BUSYG=false;render()}}

function gdSim1(){const s=GST.sim,r=(n)=>n==null?'':fm(n),sel=s.lra-(s.now-s.prev),tot=s.ex.reduce((a,x)=>a+(x||0),0),sisa=sel-tot;
 const st=sel===0?['Tidak ada selisih, tidak perlu penjelasan','g']:sisa===0&&s.ex.some(x=>x)?['Selisih terjelaskan (sisa 0)','g']:['Sisa '+fm(sisa)+' belum dijelaskan','e'];
 return`<div class="gsim" data-sim="1"><h6>Coba sendiri: selisih dan sisa</h6><div class="gs2"><label>LRA belanja modal tanah<input class="vi" inputmode="numeric" data-gs="lra" value="${r(s.lra)}"></label><label>Neraca tahun ini<input class="vi" inputmode="numeric" data-gs="now" value="${r(s.now)}"></label><label>Neraca tahun lalu<input class="vi" inputmode="numeric" data-gs="prev" value="${r(s.prev)}"></label></div>
 <p>Selisih = LRA &minus; (Neraca ini &minus; Neraca lalu) = <b data-go="sel1">${fm(sel)}</b></p>
 <div class="gs2">${[0,1,2].map(i=>`<label>Pembentuk ${'abc'[i]}) (nilai)<input class="vi" inputmode="numeric" data-gs="ex${i}" value="${r(s.ex[i])}" placeholder="0"></label>`).join('')}</div>
 <p>Total pembentuk <b data-go="tot1">${fm(tot)}</b>, sisa <b data-go="sisa1">${fm(sisa)}</b>. <span data-go="st1" class="${st[1]}">${st[0]}</span></p><small>Contoh bawaan: Neraca tanah naik 2 juta tanpa belanja modal, jadi selisihnya negatif. Coba isi pembentuk a) dengan -2.000.000.</small></div>`}
function gdSim2(){const s=GST.sim,r=n=>n==null?'':fm(n),L=s.ml,tot=L.reduce((a,x)=>a+(x.n||0),0),sisa=s.mt-tot,ak=s.aw+s.mt;
 const OP=['Pembelian - Belanja Modal Peralatan dan Mesin','Hibah Masuk','Transfer Masuk','Reklasifikasi Masuk','Koreksi Pencatatan Nilai Bertambah'];
 const ok=sisa===0&&s.mt!==0&&L.every(x=>x.n==null||x.p);
 return`<div class="gsim" data-sim="2"><h6>Coba sendiri: mutasi tambah dan pembentuk</h6><div class="gs2"><label>Saldo awal<input class="vi" inputmode="numeric" data-gs="aw" value="${r(s.aw)}"></label><label>Mutasi tambah<input class="vi" inputmode="numeric" data-gs="mt" value="${r(s.mt)}"></label></div>
 ${L.map((x,i)=>`<div class="gs2"><label>Jenis transaksi ${'ab'[i]})<select data-gs="mp${i}"><option value="">Pilih jenis transaksi</option>${OP.map(o=>`<option ${x.p===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label><label>Nilai<input class="vi" inputmode="numeric" data-gs="mn${i}" value="${r(x.n)}"></label></div>`).join('')}
 <p>Saldo akhir <b data-go="ak2">${fm(ak)}</b>, total pembentuk <b data-go="tot2">${fm(tot)}</b>, sisa <b data-go="sisa2">${fm(sisa)}</b>. <span data-go="st2" class="${ok?'g':'e'}">${ok?'Terjelaskan':sisa!==0?'Sisa belum dijelaskan':'Pilih jenis transaksi untuk setiap nilai'}</span></p><small>Bawaan: mutasi tambah 30 juta. Coba pecah menjadi Pembelian 20 juta dan Hibah Masuk 10 juta.</small></div>`}
function gdSimUpd(){const s=GST.sim,set=(k,t,c)=>{const e=document.querySelector(`[data-go="${k}"]`);if(e){e.textContent=t;if(c)e.className=c}};
 const sel=s.lra-(s.now-s.prev),tot=s.ex.reduce((a,x)=>a+(x||0),0),sisa=sel-tot;
 set('sel1',fm(sel));set('tot1',fm(tot));set('sisa1',fm(sisa));
 set('st1',sel===0?'Tidak ada selisih, tidak perlu penjelasan':sisa===0&&s.ex.some(x=>x)?'Selisih terjelaskan (sisa 0)':'Sisa '+fm(sisa)+' belum dijelaskan',sel===0||(sisa===0&&s.ex.some(x=>x))?'g':'e');
 const t2=s.ml.reduce((a,x)=>a+(x.n||0),0),s2=s.mt-t2,ok=s2===0&&s.mt!==0&&s.ml.every(x=>x.n==null||x.p);
 set('ak2',fm(s.aw+s.mt));set('tot2',fm(t2));set('sisa2',fm(s2));set('st2',ok?'Terjelaskan':s2!==0?'Sisa belum dijelaskan':'Pilih jenis transaksi untuk setiap nilai',ok?'g':'e')}
function gdQuiz(k){const Q=QZ[k],st=GST.quiz[k]||(GST.quiz[k]={a:{}}),done=Object.keys(st.a).length,sc=Object.keys(st.a).filter(i=>st.a[i]===Q[i].a).length;
 return`<div class="gquiz">${Q.map((x,i)=>{const a=st.a[i],ans=a!==undefined;return`<div class="gq"><p><b>${i+1}.</b> ${esc(x.q)}</p>${x.o.map((o,j)=>`<button class="gop ${ans?(j===x.a?'ok':j===a?'bad':''):''}" data-gq="${k}:${i}:${j}" ${ans?'disabled':''}>${esc(o)}</button>`).join('')}${ans?`<div class="gfb ${a===x.a?'ok':'bad'}"><b>${a===x.a?'Benar.':'Belum tepat.'}</b> ${esc(x.e)}</div>`:''}</div>`}).join('')}
 <p class="gscore">${done===Q.length?`Skor Anda: <b>${sc} dari ${Q.length}</b>. ${sc===Q.length?'Sempurna.':'Baca ulang langkah terkait, lalu coba lagi.'} <button data-gqr="${k}">Ulangi</button>`:`Terjawab ${done} dari ${Q.length}`}</p></div>`}
function gdStepHtml(role,i){const st=GS[role][i];const body=st.quiz?gdQuiz(st.quiz):st.h().replace('{{sim1}}',gdSim1()).replace('{{sim2}}',gdSim2());return body}
function guideHtml(){const role=gdRole(),steps=GS[role],pr=gdLoad(),done=new Set(pr[role]||[]);if(GST.step>=steps.length)GST.step=0;
 const q=GST.q.trim().toLowerCase(),hit=i=>!q||(steps[i].t+' '+(steps[i].h?steps[i].h().replace(/<[^>]+>/g,' '):'')).toLowerCase().includes(q);
 const pc=Math.round(done.size/steps.length*100),cur=steps[GST.step];
 const fq=FQ[role].filter(x=>!q||(x[0]+' '+x[1]).toLowerCase().includes(q));
 const gl=GLOS.filter(x=>!q||(x[0]+' '+x[1]).toLowerCase().includes(q));
 return`<div class="gd"><div class="gdh"><div><h2>Panduan penggunaan</h2><p>Pilih peran Anda, ikuti langkah berurutan, dan coba contoh interaktifnya. Kemajuan Anda tersimpan di browser ini.</p></div><button id="gdx" class="pri">Tutup panduan</button></div>
 <div class="gtabs"><button class="${role==='sat'?'on':''}" data-grole="sat">Untuk satker</button><button class="${role==='esl'?'on':''}" data-grole="esl">Untuk Eselon I</button><span class="sp"></span><input id="gdq" type="search" placeholder="Cari di panduan..." value="${esc(GST.q)}" aria-label="Cari di panduan"></div>
 <div class="gbar" aria-label="Kemajuan"><div style="width:${pc}%"></div></div><small>${done.size} dari ${steps.length} langkah selesai (${pc}%)</small>
 <div class="gmain"><nav class="gnav" aria-label="Daftar langkah">${steps.map((s,i)=>hit(i)?`<button class="${i===GST.step?'on':''} ${done.has(i)?'dn':''}" data-gstep="${i}"><span class="gck">${done.has(i)?'&#10003;':i+1}</span><span>${esc(s.t)}<small>${s.m} menit</small></span></button>`:'').join('')||'<small>Tidak ada langkah yang cocok.</small>'}</nav>
 <article class="gbody"><small>Langkah ${GST.step+1} dari ${steps.length}</small><h3>${esc(cur.t)}</h3>${gdStepHtml(role,GST.step)}
 <div class="gfoot"><button data-gnav="-1" ${GST.step===0?'disabled':''}>&larr; Sebelumnya</button><span class="sp"></span><button data-gdone="${GST.step}" class="${done.has(GST.step)?'':'pri'}">${done.has(GST.step)?'Batal tandai selesai':'Tandai selesai'}</button><button data-gnav="1" ${GST.step===steps.length-1?'disabled':''}>Berikutnya &rarr;</button></div></article></div>
 <section class="gfaq"><h3>Pertanyaan yang sering muncul</h3>${fq.map((x,i)=>{const id=role+i;return`<details data-gf="${id}" ${GST.faq.has(id)?'open':''}><summary>${esc(x[0])}</summary><p>${esc(x[1])}</p></details>`}).join('')||'<small>Tidak ada yang cocok.</small>'}</section>
 <section class="gfaq"><h3>Istilah</h3><dl class="gl">${gl.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl></section></div>`}
function gdMark(i){const role=gdRole(),pr=gdLoad(),a=new Set(pr[role]||[]);a.has(i)?a.delete(i):a.add(i);pr[role]=[...a];gdSave(pr)}
const gdParse=v=>pn(v);
$('#app').addEventListener('click',e=>{if(!S.gd)return;const t=e.target.closest('button');if(!t)return;
 if(t.id==='gdx'){S.gd=false;render();return}
 if(t.dataset.grole&&!t.dataset.gstep){GST.role=t.dataset.grole;GST.step=0;render();return}
 if(t.dataset.gstep!==undefined){if(t.dataset.grole)GST.role=t.dataset.grole;GST.step=+t.dataset.gstep;render();window.scrollTo(0,0);return}
 if(t.dataset.gnav){const n=gdRole(),m=GS[n].length;GST.step=Math.max(0,Math.min(m-1,GST.step+ +t.dataset.gnav));render();window.scrollTo(0,0);return}
 if(t.dataset.gdone!==undefined){gdMark(+t.dataset.gdone);render();return}
 if(t.dataset.gq){const [k,i,j]=t.dataset.gq.split(':');(GST.quiz[k]||(GST.quiz[k]={a:{}})).a[+i]=+j;const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(t.dataset.gqr){GST.quiz[t.dataset.gqr]={a:{}};render();return}});

 if(el.id==='gdq'){GST.q=el.value;const p=el.selectionStart;render();const n=$('#gdq');if(n){n.focus();n.setSelectionRange(p,p)}return}
 const k=el.dataset.gs;if(!k)return;const s=GST.sim;

 else if(/^mn\d$/.test(k))s.ml[+k[2]].n=gdParse(el.value);
 else if(/^mp\d$/.test(k))s.ml[+k[2]].p=el.value;
 gdSimUpd()});

 if(el.dataset.gf!==undefined){}});
